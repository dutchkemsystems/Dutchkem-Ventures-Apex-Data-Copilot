<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>Offline Scripts · Dutchkem Apex Data Copilot</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b1f3a;
        color: #f8faff;
        padding: 20px;
      }
      .shell {
        max-width: 720px;
        margin: 0 auto;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 16px;
        padding: 18px;
        margin-top: 14px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 12px;
        border: none;
        background: #10b981;
        color: #06281e;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
      }
      .script {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.55;
        color: #e2e8f0;
        white-space: pre-wrap;
      }
      .meta {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="meta">ApexData PWA · Offline Fallback Mode</p>
      <h1 style="margin: 4px 0 8px; font-size: 22px">You are offline</h1>
      <p style="margin: 0 0 16px; font-size: 14px; color: #cbd5e1">
        Your assigned recording scripts and Job Board briefs cached on this device remain available below.
      </p>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
        <a class="btn" style="background: #1e293b; color: #f8faff" href="/dashboard">Return to Dashboard</a>
      </div>
      <section id="cached-list"></section>
    </main>
    <script>
      (function () {
        var container = document.getElementById("cached-list");
        try {
          var raw = localStorage.getItem("apex_offline_assigned_scripts_v1");
          var items = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(items) || items.length === 0) {
            container.innerHTML =
              '<div class="card"><p class="meta">No assigned scripts cached yet. Open Dashboard or Job Board while online to sync scripts.</p></div>';
            return;
          }
          container.innerHTML = items
            .map(function (it) {
              return (
                '<article class="card">' +
                '<div class="meta">' +
                String(it.source || "Assigned Task").replace(/</g, "&lt;") +
                " · " +
                String(it.qaType || "QA").toUpperCase() +
                "</div>" +
                '<h2 style="margin:0 0 8px;font-size:16px">' +
                String(it.title || "Untitled Script").replace(/</g, "&lt;") +
                "</h2>" +
                '<p class="script">' +
                String(it.scriptNote || "").replace(/</g, "&lt;") +
                "</p>" +
                "</article>"
              );
            })
            .join("");
        } catch (e) {
          container.innerHTML = "";
        }
      })();
    </script>
  </body>
</html>
