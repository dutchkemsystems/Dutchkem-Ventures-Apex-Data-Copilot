services:
  - type: web
    name: apex-fastapi-backend
    runtime: docker
    plan: pro
    autoDeploy: false
    branch: main
    healthCheckPath: /api/health
    numInstances: 2
    envVars:
      - key: USER_SESSION_TTL_SECONDS
        value: "604800"
      - key: HEALTH_WARMUP_SECONDS
        value: "30"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
