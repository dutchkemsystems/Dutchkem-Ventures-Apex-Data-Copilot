[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 30"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
overlapSeconds = 30
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 2
