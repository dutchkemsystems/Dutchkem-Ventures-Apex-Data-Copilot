name: PR Security & Supply-Chain Audit Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit-gate:
    name: npm audit (Critical CVEs Block Merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run npm audit & Block Critical CVEs
        run: |
          if [ ! -f package-lock.json ]; then
            npm i --package-lock-only --ignore-scripts --no-audit
          fi
          npm audit --audit-level=critical --json > npm-audit-report.json || AUDIT_EXIT=$?
          CRITICAL_COUNT=$(node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("npm-audit-report.json", "utf8"));
            const c = r.metadata?.vulnerabilities?.critical ?? 0;
            console.log(c);
          ')
          echo "npm critical CVEs detected: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "${AUDIT_EXIT:-0}" -ne 0 ]; then
            echo "BLOCKED: Critical CVE found in npm dependency tree."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  pip-audit-gate:
    name: pip-audit (Critical Python CVEs Block Merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pip-audit on FastAPI Requirements
        run: |
          python -m pip install --upgrade pip pip-audit
          set +e
          pip-audit -r phase13_architecture/backend/requirements.txt --format json --output pip-audit-report.json
          PIP_AUDIT_EXIT=$?
          set -e
          CRITICAL_PY=$(python -c '
          import json
          with open("pip-audit-report.json") as f:
              data = json.load(f)
          deps = data.get("dependencies", [])
          critical = 0
          for d in deps:
              for v in d.get("vulns", []):
                  sev = str(v.get("severity", "")).lower()
                  if "critical" in sev or not sev:
                      critical += 1
          print(critical)
          ')
          echo "pip-audit findings count (critical/unclassified blocking): $CRITICAL_PY (exit=$PIP_AUDIT_EXIT)"
          if [ "$PIP_AUDIT_EXIT" -ne 0 ] && [ "$CRITICAL_PY" -gt 0 ]; then
            echo "BLOCKED: Critical CVE detected by pip-audit."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  snyk-supply-chain-scan:
    name: Snyk Supply-Chain Scan + Slack Alert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Snyk CLI on Node & Python Dependencies
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ secrets.SNYK_ORG }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not configured; emitting structured CI notice for secret provisioning."
            echo "snyk_status=skipped_missing_token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g snyk
          if [ ! -f package-lock.json ]; then
            npm i --package-lock-only --ignore-scripts --no-audit
          fi
          set +e
          snyk test --severity-threshold=high --json > snyk-node-report.json
          NODE_EXIT=$?
          snyk test --file=phase13_architecture/backend/requirements.txt --severity-threshold=high --json > snyk-python-report.json
          PY_EXIT=$?
          set -e
          echo "node_exit=$NODE_EXIT" >> "$GITHUB_OUTPUT"
          echo "py_exit=$PY_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$NODE_EXIT" -ne 0 ] || [ "$PY_EXIT" -ne 0 ]; then
            echo "snyk_status=vulnerabilities_found" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "snyk_status=clean" >> "$GITHUB_OUTPUT"

      - name: Alert Security Channel on Slack when Snyk Flags Vulnerabilities
        if: failure() && env.SLACK_SECURITY_WEBHOOK_URL != ''
        env:
          SLACK_SECURITY_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
        run: |
          curl -sS -X POST "$SLACK_SECURITY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"Snyk Supply-Chain Alert on ${{ github.repository }} (PR/Ref: ${{ github.ref_name }})\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": { \"type\": \"plain_text\", \"text\": \"Snyk Supply-Chain Vulnerability Gate Triggered\" }
                },
                {
                  \"type\": \"section\",
                  \"text\": { \"type\": \"mrkdwn\", \"text\": \"*Repo:* ${{ github.repository }}\n*Ref:* ${{ github.ref_name }}\n*Actor:* ${{ github.actor }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\" }
                }
              ]
            }"
