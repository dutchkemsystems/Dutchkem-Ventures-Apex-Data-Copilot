services:
  - type: web
    name: apex-data-copilot-backend
    runtime: node
    plan: pro
    autoDeploy: false
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /api/health
    numInstances: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEALTH_WARMUP_SECONDS
        value: "30"
      - key: USER_SESSION_TTL_SECONDS
        value: "604800"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: USER_JWT_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
